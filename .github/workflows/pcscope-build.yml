name: PCScope Windows build

# Builds the PCScope hardware tester (.exe) on a Windows runner.
#   - every push that touches tools/pcscope  -> build + upload a build artifact
#   - every tag named pcscope-v*             -> also publish a GitHub Release
on:
  push:
    branches: ["**"]
    tags: ["pcscope-v*"]
    paths:
      - "tools/pcscope/**"
      - ".github/workflows/pcscope-build.yml"
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: tools/pcscope

jobs:
  build:
    name: Build PCScope.exe (windows-latest)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      # The runner log is not always convenient to reach, so each verification
      # step mirrors its output into a workflow annotation (visible in the UI and
      # through the checks API).
      - name: Verify on a real machine (headless run)
        shell: bash
        run: |
          set +e
          python main.py --cli --quick --only system,cpu,memory,disk,disk_health,gpu,thermal,battery --html build-check.html --json build-check.json 2>&1 | tee cli-output.txt
          cli_exit=${PIPESTATUS[0]}
          EXIT_CODE=$cli_exit ANNOTATION_LEVEL=notice TITLE="headless run" \
            python -c "import os,pathlib; lines=pathlib.Path('cli-output.txt').read_text(encoding='utf-8',errors='replace').strip().splitlines(); level=os.environ['ANNOTATION_LEVEL']; tail='\n'.join(lines[-25:])[-3400:]; print('::'+level+' title='+os.environ['TITLE']+' (exit '+os.environ['EXIT_CODE']+')::'+tail.replace('%','%25').replace('\r','').replace('\n','%0A'))"
          exit 0

      - name: Smoke tests (probes, reports, cli)
        shell: bash
        run: |
          set +e
          python tests/test_smoke.py test_catalogue test_probes test_reports test_stop test_cli 2>&1 | tee smoke-output.txt
          exit_code=${PIPESTATUS[0]}
          if [ "$exit_code" -ne 0 ]; then level=error; else level=notice; fi
          EXIT_CODE=$exit_code ANNOTATION_LEVEL=$level TITLE="smoke: probes, reports, cli" \
            python -c "import os,pathlib; lines=pathlib.Path('smoke-output.txt').read_text(encoding='utf-8',errors='replace').strip().splitlines(); level=os.environ['ANNOTATION_LEVEL']; tail='\n'.join(lines[-30:])[-3400:]; print('::'+level+' title='+os.environ['TITLE']+' (exit '+os.environ['EXIT_CODE']+')::'+tail.replace('%','%25').replace('\r','').replace('\n','%0A'))"
          exit $exit_code

      - name: Smoke tests (GUI)
        shell: bash
        run: |
          set +e
          python tests/test_smoke.py test_gui 2>&1 | tee gui-output.txt
          exit_code=${PIPESTATUS[0]}
          if [ "$exit_code" -ne 0 ]; then level=error; else level=notice; fi
          EXIT_CODE=$exit_code ANNOTATION_LEVEL=$level TITLE="smoke: gui" \
            python -c "import os,pathlib; lines=pathlib.Path('gui-output.txt').read_text(encoding='utf-8',errors='replace').strip().splitlines(); level=os.environ['ANNOTATION_LEVEL']; tail='\n'.join(lines[-30:])[-3400:]; print('::'+level+' title='+os.environ['TITLE']+' (exit '+os.environ['EXIT_CODE']+')::'+tail.replace('%','%25').replace('\r','').replace('\n','%0A'))"
          exit $exit_code

      - name: Build the executables
        run: pyinstaller --noconfirm --clean pcscope.spec

      - name: Package and checksum
        shell: pwsh
        run: |
          $version = python -c "import sys; sys.path.insert(0, '.'); from pcscope.util import APP_VERSION; print(APP_VERSION)"
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $zip = "dist/PCScope-$version-windows-x64.zip"
          Compress-Archive -Path dist/PCScope.exe,dist/PCScopeCLI.exe,README.md,README.fa.md -DestinationPath $zip -Force
          Get-ChildItem dist -Filter *.exe | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Out-File -FilePath dist/SHA256SUMS.txt -Encoding utf8
          Get-FileHash $zip -Algorithm SHA256 | ForEach-Object {
            "$($_.Hash.ToLower())  $(Split-Path $zip -Leaf)"
          } | Out-File -FilePath dist/SHA256SUMS.txt -Encoding utf8 -Append
          Get-Content dist/SHA256SUMS.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PCScope-windows-x64
          path: |
            tools/pcscope/dist/PCScope.exe
            tools/pcscope/dist/PCScopeCLI.exe
            tools/pcscope/dist/PCScope-windows-x64.zip
            tools/pcscope/dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $notes = @(
            "PCScope $env:APP_VERSION - standalone Windows build.",
            "",
            "**Download:** ``PCScope.exe`` (windowed app), or the ``.zip`` bundle if your browser",
            "or antivirus is fussy about single-file executables. ``PCScopeCLI.exe`` runs the same",
            "tests from a terminal and writes HTML / TXT / JSON reports.",
            "",
            "``SHA256SUMS.txt`` lists the checksum of each file. Verify with:",
            "",
            "```bat",
            "certutil -hashfile PCScope.exe SHA256",
            "```",
            "",
            "---",
            "",
            "**PCScope $env:APP_VERSION** - بیلد مستقل ویندوز.",
            "",
            "فایل ``PCScope.exe`` (برنامه گرافیکی) یا بسته ``.zip`` را دانلود کنید.",
            "``PCScopeCLI.exe`` همان تست‌ها را در خط فرمان اجرا می‌کند و گزارش",
            "HTML / TXT / JSON می‌نویسد. فایل ``SHA256SUMS.txt`` چک‌سام همه فایل‌ها را دارد.",
            "",
            "**نکته:** ویندوز و برخی آنتی‌ویروس‌ها فایل‌های اجرایی امضا‌نشده را ناشناس نشان می‌دهند؛",
            "روی «More info > Run anyway» بزنید. برای دیدن سنسورهای دما، برنامه را",
            "با گزینه «Run as administrator» اجرا کنید."
          ) -join "`n"

          $notesPath = Join-Path $env:RUNNER_TEMP "release-notes.md"
          Set-Content -Path $notesPath -Value $notes -Encoding utf8

          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo $env:GITHUB_REPOSITORY --title "PCScope $env:APP_VERSION" --notes-file $notesPath --verify-tag
          }
          gh release upload $tag --repo $env:GITHUB_REPOSITORY dist/PCScope.exe dist/PCScopeCLI.exe dist/PCScope-windows-x64.zip dist/SHA256SUMS.txt --clobber
